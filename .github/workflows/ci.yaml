name: CI


on:
  pull_request:
    branches:
      - main
  push: 
    branches:
      - main
      - feature/**

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_IDS: dummy-channel

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      
      - name: Lint
        run: |
          ruff check . --fix
          ruff format .
          git diff

           
      - name: Run tests
        run: PYTHONPATH=. pytest --ignore=tests/integration.py

      - name: Output
        run: echo "Test success"

      
  


  integration-test:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ytwatcher_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/ytwatcher_test
        run: PYTHONPATH=. pytest tests/integration.py
  
  docker-image-build:
    needs: integration-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t yt-watcher .

