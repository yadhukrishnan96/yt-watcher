apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-watcher
  namespace: yt-watcher
  labels:
    app: yt-watcher 
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: yt-watcher  
  template:
    metadata:
      labels:
        app: yt-watcher
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: yt-watcher 
        image: ghcr.io/yadhukrishnan96/yt-watcher:485dffd09d76aad8519ea9545939660dc81d43ac
        imagePullPolicy: Always 
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
             name: yt-watcher-config
          - secretRef:
              name: yt-watcher-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 30
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

          



---

apiVersion: v1
kind: Service
metadata:
  name: yt-watcher-service
  namespace: yt-watcher
spec:
  selector:
    app: yt-watcher

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

  type: ClusterIP
