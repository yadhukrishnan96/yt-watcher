version: "3.9"

services:
  app:
    image: yt-watcher:latest
    ports:
      - "8000:8000"
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL} 
      REDIS_URL: ${REDIS_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      YOUTUBE_CHANNEL_IDS: ${YOUTUBE_CHANNEL_IDS}   # e.g. UCxxxxxx,UCyyyyyy

      # ── Tunable ─────────────────────────────────────────────────────────────
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-900}  # default 15 min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ytwatcher
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
