# IMPORTANT: Never commit real values to git.
# Usage:
#   kubectl create secret generic yt-watcher-secrets \
#     --from-literal=telegram-bot-token='YOUR_TOKEN_HERE' \
#     --from-literal=telegram-chat-id='YOUR_CHAT_ID_HERE' \
#     --from-literal=postgres-password='YOUR_DB_PASSWORD' \
#     -n yt-watcher
#
# Or use a secrets manager (Sealed Secrets, External Secrets Operator, Vault).
# The YAML below is a TEMPLATE — base64-encode values before applying.
#
#   echo -n 'value' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: yt-watcher-secrets
  namespace: yt-watcher
type: Opaque
data:
  # Replace with: echo -n 'YOUR_BOT_TOKEN' | base64
  telegram-bot-token: REPLACE_WITH_BASE64
  # Replace with: echo -n 'YOUR_CHAT_ID' | base64
  telegram-chat-id: REPLACE_WITH_BASE64
  # Replace with: echo -n 'YOUR_DB_PASSWORD' | base64
  postgres-password: REPLACE_WITH_BASE64
